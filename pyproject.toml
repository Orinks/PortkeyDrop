[project]
name = "portkeydrop"
version = "0.5.1"
description = "A keyboard-first file transfer client for SFTP, FTP, FTPS, and WebDAV"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncssh>=2.14",
    "puttykeys",
    "keyring>=25.0",
    "platform-utils>=1.6.0",
    "sound_lib @ git+https://github.com/samtupy/sound_lib_macos_fixes.git",
    "wxPython>=4.2",
    "prismatoid",
    "webdavclient3>=3.14",
]

[project.optional-dependencies]
webdav = [
    "webdavclient3>=3.14",
]
build = [
    "nuitka>=4.0.8",
    "pillow",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.0",
    "diff-cover>=9.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
portkeydrop = "portkeydrop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portkeydrop"]
artifacts = [
    "src/portkeydrop/default_soundpacks/**/*.json",
    "src/portkeydrop/default_soundpacks/**/*.ogg",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/portkeydrop"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.15.0",
    "diff-cover>=9.0.0",
]
