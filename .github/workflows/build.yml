name: Build

on:
  schedule:
    # Nightly at 00:27 UTC (8:27 PM EDT / 7:27 PM EST), near AccessiWeather.
    # GitHub Actions schedules are UTC-only and can queue late, so avoid :00/:30.
    - cron: "27 0 * * *"
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip release creation'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      is_nightly: ${{ steps.check.outputs.is_nightly }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'dev' }}
          fetch-depth: 0

      - name: Check build conditions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_nightly=false" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "tag=nightly-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)
            LATEST_STABLE_TAG=$(git tag --list "v*" --sort=-version:refname | head -1)

            # Build when there is something new to tell the user, not merely
            # when a source file moved. Gating on file changes is what ships a
            # release whose notes read "No user-facing changes"; a commit
            # saying "[nightly build]" forces one when the reason is real but
            # has no changelog bullet.
            : > previous-notes.md
            : > latest-stable-notes.md
            if [ -n "$LAST_TAG" ]; then
              gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
            fi
            if [ -n "$LATEST_STABLE_TAG" ]; then
              gh release view "$LATEST_STABLE_TAG" --json body -q .body > latest-stable-notes.md || true
            fi

            python scripts/changelog_tools.py should-build-nightly \
              --previous-tag "$LAST_TAG" \
              --head HEAD \
              --exclude-notes previous-notes.md \
              --latest-stable-tag "$LATEST_STABLE_TAG" \
              --exclude-stable-notes latest-stable-notes.md >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.is_nightly == 'true' && 'dev' || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # wxdragon-sys downloads wxWidgets and builds it with CMake, which is the
      # slowest part of a cold build by a wide margin. The cache is keyed on the
      # lock file, so it survives everything except a dependency change.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Stage the install tree
        run: |
          mkdir -p dist/PortkeyDrop_dir
          # The installer script expects this capitalisation; cargo emits the
          # crate name in lower case.
          cp target/release/portkeydrop.exe dist/PortkeyDrop_dir/PortkeyDrop.exe
          cp target/release/prism.dll dist/PortkeyDrop_dir/prism.dll
          {
            echo "[version]"
            echo "value=${{ needs.prepare.outputs.version }}"
          } > dist/version.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DMyAppVersion=${{ needs.prepare.outputs.version }}" \
            installer/portkeydrop.iss

      - name: Build the portable ZIP
        run: |
          # A portable install keeps its configuration beside the executable,
          # which is what the marker switches on. Without it a copy on a USB
          # stick would write to the host machine's profile instead.
          cp -r dist/PortkeyDrop_dir dist/PortkeyDrop_Portable
          : > dist/PortkeyDrop_Portable/.portable
          (cd dist/PortkeyDrop_Portable && 7z a -tzip \
            "../PortkeyDrop_Portable_v${{ needs.prepare.outputs.version }}.zip" .)

      - name: Check what is about to ship
        run: |
          test -f "dist/PortkeyDrop_Setup_v${{ needs.prepare.outputs.version }}.exe"
          test -f "dist/PortkeyDrop_Portable_v${{ needs.prepare.outputs.version }}.zip"
          # A build without the speech library runs mute, and a screen reader
          # user has no way to tell until they launch it.
          test -f dist/PortkeyDrop_dir/prism.dll
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/PortkeyDrop_Setup_*.exe
            dist/PortkeyDrop_Portable_*.zip

  # The macOS and Linux jobs are gone with the Python build they ran. Bringing
  # them back as cargo builds needs the Prism speech library vendored for those
  # platforms first: crates/prism-sys/vendor carries only the Windows DLL, and
  # a file transfer client for screen reader users that cannot speak is not
  # something to publish. `git log -- .github/workflows/build.yml` has the
  # PyInstaller versions to work from.
  release:
    name: Release
    needs: [prepare, build-windows]
    if: always() && needs.prepare.outputs.should_build == 'true' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.is_nightly == 'true' && 'dev' || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release
        id: prep
        env:
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CLIFF_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          TIMESTAMP=$(date -u +%Y%m%d)

          # Rename assets based on release type
          for f in dist/*.exe dist/*.zip dist/*.tar.gz dist/*.AppImage; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ "$IS_NIGHTLY" = "true" ]; then
              case "$name" in
                *Setup*.exe) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-windows-setup.exe" ;;
                *Portable*.zip) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-windows-portable.zip" ;;
                *macOS*.zip) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-macOS.zip" ;;
                *Linux*.tar.gz) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-linux.tar.gz" ;;
                *Linux*.AppImage) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-linux-x86_64.AppImage" ;;
              esac
            else
              case "$name" in
                *Setup*.exe) mv "$f" "assets/PortkeyDrop-${VERSION}-windows-setup.exe" ;;
                *Portable*.zip) mv "$f" "assets/PortkeyDrop-${VERSION}-windows-portable.zip" ;;
                *macOS*.zip) mv "$f" "assets/PortkeyDrop-${VERSION}-macOS.zip" ;;
                *Linux*.tar.gz) mv "$f" "assets/PortkeyDrop-${VERSION}-linux.tar.gz" ;;
                *Linux*.AppImage) mv "$f" "assets/PortkeyDrop-${VERSION}-linux-x86_64.AppImage" ;;
              esac
            fi
          done

          # Generate checksums
          cd assets && sha256sum * > checksums.txt 2>/dev/null || true

          # Generate release notes from curated CHANGELOG.md entries.
          cd ..
          if [ "$IS_NIGHTLY" = "true" ]; then
            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)
            if [ -n "$LAST_TAG" ]; then
              gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
              : > latest-stable-notes.md
              LATEST_STABLE_TAG=$(git tag --list "v*" --sort=-version:refname | head -1)
              if [ -n "$LATEST_STABLE_TAG" ]; then
                gh release view "$LATEST_STABLE_TAG" --json body -q .body > latest-stable-notes.md || true
              fi
              python scripts/changelog_tools.py notes \
                --kind nightly \
                --previous-tag "$LAST_TAG" \
                --exclude-notes previous-notes.md \
                --exclude-stable-notes latest-stable-notes.md \
                --output notes.md
            else
              python scripts/changelog_tools.py notes --kind nightly --output notes.md
            fi
          else
            python scripts/changelog_tools.py notes \
              --kind stable \
              --version "$TAG" \
              --output notes.md
          fi

      - name: Create release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$IS_NIGHTLY" = "true" ]; then
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" assets/* --notes-file notes.md \
              --title "Nightly $(date -u +%Y-%m-%d)" --prerelease --target dev
          else
            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --notes-file notes.md --title "PortkeyDrop v${VERSION}"
            else
              gh release create "$TAG" assets/* --notes-file notes.md \
                --title "PortkeyDrop v${VERSION}"
            fi
          fi

      - name: Send build notification
        if: ${{ inputs.dry_run != true }}
        env:
          ORINKS_BUILD_NOTIFICATION_TOKEN: ${{ secrets.ORINKS_BUILD_NOTIFICATION_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
        run: |
          if [ -z "$ORINKS_BUILD_NOTIFICATION_TOKEN" ]; then
            echo "ORINKS_BUILD_NOTIFICATION_TOKEN is not configured; skipping notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          product = "PortkeyDrop"
          release_kind = "nightly build" if os.environ["IS_NIGHTLY"] == "true" else "stable release"
          payload = {
              "product": product,
              "title": f"{product} {release_kind} available",
              "body": f"A new {product} {release_kind} is ready to download.",
              "url": "/portkeydrop/downloads",
          }
          request = urllib.request.Request(
              "https://www.orinks.net/api/notifications/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ORINKS_BUILD_NOTIFICATION_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY
