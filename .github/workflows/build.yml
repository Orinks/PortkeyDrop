name: Build

on:
  schedule:
    # Nightly at 00:27 UTC (8:27 PM EDT / 7:27 PM EST), near AccessiWeather.
    # GitHub Actions schedules are UTC-only and can queue late, so avoid :00/:30.
    - cron: "27 0 * * *"
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip release creation'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Windows runners default to PowerShell, where a trailing backslash is a parse
# error rather than a line continuation. The Python jobs this replaced were
# single `python ...` calls that ran the same under either shell, so nothing
# here needed a default before.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      is_nightly: ${{ steps.check.outputs.is_nightly }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' && 'dev') || github.ref }}
          fetch-depth: 0

      - name: Check build conditions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_nightly=false" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          elif [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            # A run someone started by hand is a request for a build. The gate
            # below exists to stop the nightly schedule publishing a release
            # with nothing to say, which is not what a manual run is doing.
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=nightly-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "tag=nightly-$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)
            LATEST_STABLE_TAG=$(git tag --list "v*" --sort=-version:refname | head -1)

            # Build when there is something new to tell the user, not merely
            # when a source file moved. Gating on file changes is what ships a
            # release whose notes read "No user-facing changes"; a commit
            # saying "[nightly build]" forces one when the reason is real but
            # has no changelog bullet.
            : > previous-notes.md
            : > latest-stable-notes.md
            if [ -n "$LAST_TAG" ]; then
              gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
            fi
            if [ -n "$LATEST_STABLE_TAG" ]; then
              gh release view "$LATEST_STABLE_TAG" --json body -q .body > latest-stable-notes.md || true
            fi

            python scripts/changelog_tools.py should-build-nightly \
              --previous-tag "$LAST_TAG" \
              --head HEAD \
              --exclude-notes previous-notes.md \
              --latest-stable-tag "$LATEST_STABLE_TAG" \
              --exclude-stable-notes latest-stable-notes.md >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Windows
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' && 'dev') || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # wxdragon-sys downloads wxWidgets and builds it with CMake, which is the
      # slowest part of a cold build by a wide margin. The cache is keyed on the
      # lock file, so it survives everything except a dependency change.
      # wxdragon-sys downloads wxWidgets and builds it with CMake, which is
      # nearly all of a cold build. Two settings matter more than they look:
      #
      # cache-on-failure keeps that work when a later step fails. Without it
      # a run that dies packaging the installer throws away forty minutes of
      # C++ compilation, and the next attempt starts from nothing again.
      #
      # shared-key lets this job reuse what CI built on the same OS instead
      # of each workflow keeping its own copy.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ runner.os }}

      - name: Build
        run: cargo build --release --locked

      - name: Stage the install tree
        run: |
          mkdir -p dist/PortkeyDrop_dir
          # The installer script expects this capitalisation; cargo emits the
          # crate name in lower case.
          cp target/release/portkeydrop.exe dist/PortkeyDrop_dir/PortkeyDrop.exe
          cp target/release/prism.dll dist/PortkeyDrop_dir/prism.dll
          {
            echo "[version]"
            echo "value=${{ needs.prepare.outputs.version }}"
          } > dist/version.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          # No /DMyAppVersion here: Git Bash rewrites anything that looks
          # like a Unix path, so the flag reached ISCC as a second script
          # filename. The staging step already wrote dist/version.txt,
          # which the script reads when no version is given on the command
          # line.
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/portkeydrop.iss

      - name: Build the portable ZIP
        run: |
          # A portable install keeps its configuration beside the executable,
          # which is what the marker switches on. Without it a copy on a USB
          # stick would write to the host machine's profile instead.
          cp -r dist/PortkeyDrop_dir dist/PortkeyDrop_Portable
          : > dist/PortkeyDrop_Portable/.portable
          (cd dist/PortkeyDrop_Portable && 7z a -tzip \
            "../PortkeyDrop_Portable_v${{ needs.prepare.outputs.version }}.zip" .)

      - name: Check what is about to ship
        run: |
          test -f "dist/PortkeyDrop_Setup_v${{ needs.prepare.outputs.version }}.exe"
          test -f "dist/PortkeyDrop_Portable_v${{ needs.prepare.outputs.version }}.zip"
          # A build without the speech library runs mute, and a screen reader
          # user has no way to tell until they launch it.
          test -f dist/PortkeyDrop_dir/prism.dll
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/PortkeyDrop_Setup_*.exe
            dist/PortkeyDrop_Portable_*.zip

  build-macos:
    name: macOS
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' && 'dev') || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # wxdragon-sys downloads wxWidgets and builds it with CMake, which is
      # nearly all of a cold build. Two settings matter more than they look:
      #
      # cache-on-failure keeps that work when a later step fails. Without it
      # a run that dies packaging the installer throws away forty minutes of
      # C++ compilation, and the next attempt starts from nothing again.
      #
      # shared-key lets this job reuse what CI built on the same OS instead
      # of each workflow keeping its own copy.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ runner.os }}

      # One universal binary rather than a build per architecture: the
      # updater picks an asset by platform alone, with no notion of
      # architecture, so publishing two would hand half of macOS the wrong
      # one. wxWidgets gets built twice here, which is why the timeout is
      # generous.
      - name: Build for both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Assemble the app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APP="dist/PortkeyDrop.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks"

          lipo -create -output "$APP/Contents/MacOS/PortkeyDrop" \
            target/aarch64-apple-darwin/release/portkeydrop \
            target/x86_64-apple-darwin/release/portkeydrop

          # The loader looks beside the executable and then in
          # ../Frameworks, which is where a bundle keeps its libraries.
          lipo -create -output "$APP/Contents/Frameworks/libprism.dylib" \
            crates/prism-sys/vendor/macos-aarch64/libprism.dylib \
            crates/prism-sys/vendor/macos-x86_64/libprism.dylib

          sed -e "s|<string>0\.0\.0</string>|<string>${VERSION}</string>|g" \
            installer/macos/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

          # Prism is MPL-2.0; its licence ships inside the bundle.
          mkdir -p "$APP/Contents/Resources"
          cp crates/prism-sys/vendor/licenses/LICENSE "$APP/Contents/Resources/PRISM-LICENSE"
          cp crates/prism-sys/vendor/licenses/NOTICE "$APP/Contents/Resources/PRISM-NOTICE"

          # An unsigned bundle copied out of a DMG is quarantined; ad-hoc
          # signing at least keeps it launchable without Gatekeeper refusing
          # the whole bundle outright.
          codesign --force --deep --sign - "$APP"

      - name: Check the bundle before packaging it
        run: |
          APP="dist/PortkeyDrop.app"
          # Both architectures actually present, in both the executable and
          # the speech library. A thin binary here is silent breakage for
          # every user on the other architecture.
          # Read the output rather than piping it: steps run with pipefail,
          # and `grep -q` closing the pipe early makes the producer fail.
          executable_arches=$(lipo -info "$APP/Contents/MacOS/PortkeyDrop")
          library_arches=$(lipo -info "$APP/Contents/Frameworks/libprism.dylib")
          echo "$executable_arches"
          echo "$library_arches"
          [[ "$executable_arches" == *"x86_64 arm64"* ]]
          [[ "$library_arches" == *"x86_64 arm64"* ]]
          test -f "$APP/Contents/Info.plist"

      - name: Build the disk image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # A DMG, not a ZIP: the updater's macOS path mounts a DMG and
          # replaces the bundle itself, where anything else it can only hand
          # to Finder for the user to finish by hand.
          hdiutil create -volname "Portkey Drop" \
            -srcfolder dist/PortkeyDrop.app \
            -ov -format UDZO \
            "dist/PortkeyDrop_macOS_v${VERSION}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/PortkeyDrop_macOS_*.dmg

  build-linux:
    name: Linux
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' && 'dev') || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # wxdragon-sys downloads wxWidgets and builds it with CMake, which is
      # nearly all of a cold build. Two settings matter more than they look:
      #
      # cache-on-failure keeps that work when a later step fails. Without it
      # a run that dies packaging the installer throws away forty minutes of
      # C++ compilation, and the next attempt starts from nothing again.
      #
      # shared-key lets this job reuse what CI built on the same OS instead
      # of each workflow keeping its own copy.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ${{ runner.os }}

      # wxdragon-sys builds wxWidgets from source, which needs GTK's headers.
      # Built on 22.04 rather than latest so the result runs on older glibc:
      # a binary linked against a newer one will not start on a distro that
      # ships an older release, and there is no useful error when it does not.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libasound2-dev pkg-config cmake \
            libssl-dev file desktop-file-utils

      - name: Build
        run: cargo build --release --locked

      - name: Stage the install tree
        run: |
          mkdir -p dist/PortkeyDrop
          cp target/release/portkeydrop dist/PortkeyDrop/PortkeyDrop
          # The Prism library and everything it carries. It resolves those
          # through a RUNPATH of $ORIGIN, so they must stay beside it.
          cp crates/prism-sys/vendor/linux-x86_64/*.so* dist/PortkeyDrop/
          cp crates/prism-sys/vendor/licenses/LICENSE dist/PortkeyDrop/PRISM-LICENSE
          cp crates/prism-sys/vendor/licenses/NOTICE dist/PortkeyDrop/PRISM-NOTICE
          cp crates/prism-sys/vendor/linux-x86_64/PROVENANCE.txt dist/PortkeyDrop/PRISM-PROVENANCE.txt

      - name: Check the speech library resolves
        run: |
          cd dist/PortkeyDrop
          # ldd on the library itself, not the executable: Prism is opened at
          # run time, so a missing dependency is invisible until the app is
          # already running and silent.
          # This check failed open before: `grep -q` matching "not found"
          # exits at once, ldd takes SIGPIPE, pipefail fails the pipeline, and
          # the `if` reads that as no match -- so a library that could not be
          # loaded sailed through the check meant to catch it.
          resolved=$(ldd libprism.so)
          echo "$resolved"
          if grep -q "not found" <<<"$resolved"; then
            echo "libprism.so has unresolved dependencies:"
            grep "not found" <<<"$resolved"
            exit 1
          fi

      - name: Build the tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tar -czf "dist/PortkeyDrop_Linux_v${VERSION}.tar.gz" -C dist PortkeyDrop

      - name: Build the AppImage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APPDIR=dist/PortkeyDrop.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp dist/PortkeyDrop/PortkeyDrop dist/PortkeyDrop/*.so* "$APPDIR/usr/bin/"
          cp installer/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/PortkeyDrop"
          cp installer/appimage/portkeydrop.desktop "$APPDIR/portkeydrop.desktop"
          cp installer/appimage/portkeydrop.desktop "$APPDIR/usr/share/applications/"
          cp installer/appimage/portkeydrop.png "$APPDIR/portkeydrop.png"
          cp installer/appimage/portkeydrop.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/"
          desktop-file-validate "$APPDIR/portkeydrop.desktop"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE on the runner, so the tool is unpacked and run in place.
          ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "dist/PortkeyDrop_Linux_v${VERSION}.AppImage"

      - name: Check what is about to ship
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "dist/PortkeyDrop_Linux_v${VERSION}.tar.gz"
          test -f "dist/PortkeyDrop_Linux_v${VERSION}.AppImage"
          # The speech library has to be inside both, or the build runs mute
          # and nothing says so until a user launches it.
          contents=$(tar -tzf "dist/PortkeyDrop_Linux_v${VERSION}.tar.gz")
          [[ "$contents" == *"libprism.so"* ]]
          ls -la dist/*.tar.gz dist/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/PortkeyDrop_Linux_*.tar.gz
            dist/PortkeyDrop_Linux_*.AppImage

  release:
    name: Release
    needs: [prepare, build-windows, build-macos, build-linux]
    if: always() && needs.prepare.outputs.should_build == 'true' && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' && 'dev') || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release
        id: prep
        env:
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CLIFF_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          TIMESTAMP=$(date -u +%Y%m%d)

          # Rename assets based on release type
          for f in dist/*.exe dist/*.zip dist/*.dmg dist/*.tar.gz dist/*.AppImage; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ "$IS_NIGHTLY" = "true" ]; then
              case "$name" in
                *Setup*.exe) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-windows-setup.exe" ;;
                *Portable*.zip) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-windows-portable.zip" ;;
                *macOS*.dmg) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-macOS.dmg" ;;
                *Linux*.tar.gz) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-linux.tar.gz" ;;
                *Linux*.AppImage) mv "$f" "assets/PortkeyDrop-nightly-${TIMESTAMP}-linux-x86_64.AppImage" ;;
              esac
            else
              case "$name" in
                *Setup*.exe) mv "$f" "assets/PortkeyDrop-${VERSION}-windows-setup.exe" ;;
                *Portable*.zip) mv "$f" "assets/PortkeyDrop-${VERSION}-windows-portable.zip" ;;
                *macOS*.dmg) mv "$f" "assets/PortkeyDrop-${VERSION}-macOS.dmg" ;;
                *Linux*.tar.gz) mv "$f" "assets/PortkeyDrop-${VERSION}-linux.tar.gz" ;;
                *Linux*.AppImage) mv "$f" "assets/PortkeyDrop-${VERSION}-linux-x86_64.AppImage" ;;
              esac
            fi
          done

          # Generate checksums
          cd assets && sha256sum * > checksums.txt 2>/dev/null || true

          # Generate release notes from curated CHANGELOG.md entries.
          cd ..
          if [ "$IS_NIGHTLY" = "true" ]; then
            LAST_TAG=$(git tag --list "nightly-*" --sort=-version:refname | head -1)
            if [ -n "$LAST_TAG" ]; then
              gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
              : > latest-stable-notes.md
              LATEST_STABLE_TAG=$(git tag --list "v*" --sort=-version:refname | head -1)
              if [ -n "$LATEST_STABLE_TAG" ]; then
                gh release view "$LATEST_STABLE_TAG" --json body -q .body > latest-stable-notes.md || true
              fi
              python scripts/changelog_tools.py notes \
                --kind nightly \
                --previous-tag "$LAST_TAG" \
                --exclude-notes previous-notes.md \
                --exclude-stable-notes latest-stable-notes.md \
                --output notes.md
            else
              python scripts/changelog_tools.py notes --kind nightly --output notes.md
            fi
          else
            python scripts/changelog_tools.py notes \
              --kind stable \
              --version "$TAG" \
              --output notes.md
          fi

      - name: Create release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$IS_NIGHTLY" = "true" ]; then
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" assets/* --notes-file notes.md \
              --title "Nightly $(date -u +%Y-%m-%d)" --prerelease --target dev
          else
            if gh release view "$TAG" &>/dev/null; then
              gh release upload "$TAG" assets/* --clobber
              gh release edit "$TAG" --notes-file notes.md --title "PortkeyDrop v${VERSION}"
            else
              gh release create "$TAG" assets/* --notes-file notes.md \
                --title "PortkeyDrop v${VERSION}"
            fi
          fi

      - name: Send build notification
        if: ${{ inputs.dry_run != true }}
        env:
          ORINKS_BUILD_NOTIFICATION_TOKEN: ${{ secrets.ORINKS_BUILD_NOTIFICATION_TOKEN }}
          IS_NIGHTLY: ${{ needs.prepare.outputs.is_nightly }}
        run: |
          if [ -z "$ORINKS_BUILD_NOTIFICATION_TOKEN" ]; then
            echo "ORINKS_BUILD_NOTIFICATION_TOKEN is not configured; skipping notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          product = "PortkeyDrop"
          release_kind = "nightly build" if os.environ["IS_NIGHTLY"] == "true" else "stable release"
          payload = {
              "product": product,
              "title": f"{product} {release_kind} available",
              "body": f"A new {product} {release_kind} is ready to download.",
              "url": "/portkeydrop/downloads",
          }
          request = urllib.request.Request(
              "https://www.orinks.net/api/notifications/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ORINKS_BUILD_NOTIFICATION_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY
