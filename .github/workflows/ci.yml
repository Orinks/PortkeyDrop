name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always
  # A warning that only fails locally is a warning nobody fixes.
  RUSTFLAGS: "-D warnings"

jobs:
  changelog-check:
    name: CHANGELOG Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Check CHANGELOG entry
      # Skipped when a PR carries the `skip-changelog` label. On non-PR events
      # the labels expression is null and contains() is false, so pushes still
      # run the gate and rely on a `Changelog: none` commit trailer instead.
      if: "!contains(github.event.pull_request.labels.*.name, 'skip-changelog')"
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:${BASE}" || true
          echo "PR detected - checking changelog entries against $BASE"
        elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          BASE="${{ github.event.before }}"
          git fetch --no-tags origin "$BASE" || true
          echo "Push detected - checking changelog entries against $BASE"
        else
          BASE="HEAD~1"
          echo "Manual run detected - checking changelog entries against $BASE"
        fi

        if ! python scripts/changelog_tools.py check --base "$BASE" --head HEAD; then
          {
            echo "### CHANGELOG gate"
            echo
            echo "User-facing changes need a curated \`CHANGELOG.md\` entry under \`## Unreleased\`."
            echo "This keeps nightly and stable release notes based on product wording instead of PR titles."
            echo
            echo "If the change really has nothing to tell a user, add a \`Changelog: none\`"
            echo "trailer to every commit, or put the \`skip-changelog\` label on the PR."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install pytest
      run: pip install pytest

    # changelog_tools.py decides whether a nightly ships and what its notes
    # say. It outlived the Python application, so its tests have to outlive
    # the Python test suite too -- one of them already caught a marker that
    # fired on prose.
    - name: Test
      run: python -m pytest tests/test_changelog_tools.py -q

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  core:
    name: Core (Ubuntu)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2

    # Deliberately not the whole workspace: the UI crate pulls wxdragon-sys,
    # which downloads and builds wxWidgets from source with CMake. The crates
    # tested here have no UI dependency by design, so they give fast feedback
    # on protocol parsing, transfer rules, and credential handling.
    - name: Clippy
      run: cargo clippy -p portkeydrop-core -p prism -p prism-sys --all-targets

    - name: Test
      run: cargo test -p portkeydrop-core -p prism -p prism-sys

  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2

    # The full workspace, including the wxWidgets front end. One platform
    # rather than three: wxdragon-sys builds wxWidgets from source, so a
    # matrix here would triple the slowest job in the file. The release
    # workflow compiles all three, which is where a platform-specific break
    # surfaces.
    - name: Clippy
      run: cargo clippy --workspace --all-targets

    - name: Test
      run: cargo test --workspace
