[workspace]
resolver = "2"
members = [
    "crates/prism-sys",
    "crates/prism",
    "crates/portkeydrop-core",
    "crates/portkeydrop",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Orinks/PortkeyDrop"
authors = ["Portkey Drop contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
